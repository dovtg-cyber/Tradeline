{% extends 'base.html' %}{% block content %}<div class="formbox"><p class="eyebrow">CLIENT PORTAL</p><h1>{{'Create account' if mode=='register' else 'Welcome back'}}</h1><form method="post">{% if mode=='register' %}<label>Full name<input name="name" required autocomplete="name"></label>{% endif %}<label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="10" required autocomplete="{{'new-password' if mode=='register' else 'current-password'}}"></label><button class="btn">{{'Create account' if mode=='register' else 'Sign in'}}</button></form><p class="muted">{% if mode=='register' %}Already registered? <a href="/login">Sign in</a>{% else %}New to TRADELINE? <a href="/register">Create an account</a>{% endif %}</p></div>{% endblock %}
